<style>

*{box-sizing:border-box}

.logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(145deg,#0f2a3a,#050a0e);border:1px solid #2a4658;display:grid;place-items:center;font:800 28px Georgia,serif;color:var(--a);box-shadow:0 0 18px #38bdf833}

.pages{display:flex;overflow:hidden}.pg{min-width:100%;transition:margin .3s}.pages:not(.f) #pf{height:0;overflow:hidden}.pages.f .pg:first-child{height:0;overflow:hidden;margin-inline-start:-100%}

a.lk{display:inline-block;padding:6px 12px;border:1.5px solid var(--a);color:var(--a);border-radius:12px;text-decoration:none;font-size:14px}.tpl{max-width:100%;border-radius:12px;border:1px solid var(--b);margin:8px 0}
[dir=rtl] .card{border-left:1px solid var(--b);border-right:4px solid var(--a)}
</style></head><body>

let lang=localStorage.lang||'en',me=null,sess=null,tab='c',flt='All',q='',showForm=false,D={c:[],t:[],o:[],n:[],i:[],a:[],l:[],m:[],cl:[]},expandedPosts=new Set,expandedThreads=new Set,authMode='in',aq='',ch=null,view='w',flowId=location.hash.startsWith('#candidate/')?decodeURIComponent(location.hash.slice(11)):null,flowStep=1;

  const effectiveOffers=selectedOffers.length?selectedOffers:offers.slice(0,1);
  const workflows=effectiveOffers.map(workflowFor);

    const scheduleHtml=needsDate?`<label>Interview date</label><input id="interview-date" type="date" value="${esc(c.interview_date||'')}"><label>Interview time</label><input id="interview-time" type="time" value="${esc(c.interview_time||'')}"><div class="meta">Available schedule: ${esc(schedule||'See offer details')}</div>`:'';
    a.innerHTML=`<div class="card"><button id="back">← ${t('Work')}</button><h2 style="margin-top:14px">${isWgs?'Contact recruiter':'Application form'}</h2><div class="meta">${esc(c.full_name)} · ${esc((c.approved_offers||[]).join(' · '))}</div>${isWgs?'<p>WGs applications are handled by WhatsApp.</p>':hasCall?'<p>Complete the form, then the call interview instruction will be shown. No screenshot is required.</p>':hasOnline?'<p>Complete the form, then wait for the online interview instruction. No screenshot is required.</p>':'<p>Complete the form, then wait for Prime to confirm that the company is ready to receive you. Do not go to the site before that confirmation.</p>'}${action}${scheduleHtml}${isWgs?'':'<button class="p" id="next">Next →</button>'}</div>`;

    if(!isWgs)$('#next').onclick=async()=>{const date=$('#interview-date')?.value||null,time=$('#interview-time')?.value||null;if(needsDate&&(!date||!time))return toast('Choose the interview date and time first');const message=workflowMessage(workflows[0],c,date,time);const data={form_done:true};if(needsDate)Object.assign(data,{interview_date:date,interview_time:time,confirmation_message:message});const{error}=await saveWorkflow(c.id,data);if(error)return toast(error.message);await load();flowStep=2;render()};
    return
  }

  };
}
function bindCard(el){

  el.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
  el.querySelectorAll('[data-att]').forEach(b=>b.onclick=async()=>{const{error}=await sb.from('candidates').update({attendance_status:b.dataset.att}).eq('id',c.id);if(error)return toast(error.message);await load();render()});
  el.querySelectorAll('[data-site-confirm]').forEach(b=>b.onclick=async()=>{const{error}=await saveWorkflow(c.id,{site_confirmed:true});if(error)return toast(error.message);await load();render();toast('Interview details released')});
  el.querySelector('.w').onclick=()=>wa(c);
  const fd=el.querySelector('.fd');if(fd)fd.onclick=async()=>{const{error}=await sb.from('candidates').update({form_done:true}).eq('id',c.id);if(error)return toast(error.message);await load();render();toast(t('Saved'))};
  const ss=el.querySelector('.ss');if(ss)ss.onclick=async()=>{const f=el.querySelector('.sf').files[0];if(!f)return toast('Choose a screenshot first');ss.disabled=true;
    const path=`${sess.user.id}/shot-${Date.now()}-${f.name.replace(/[^\w.\-]/g,'_')}`;const u=await sb.storage.from('voice-notes').upload(path,f);if(u.error){ss.disabled=false;return toast(u.error.message)}
    const url=sb.storage.from('voice-notes').getPublicUrl(path).data.publicUrl;const{error}=await sb.from('candidates').update({shot_path:path,shot_url:url}).eq('id',c.id);if(error){ss.disabled=false;return toast(error.message)}await load();render();toast(t('Saved'))};
  if(el.querySelector('.sv'))el.querySelector('.sv').onclick=async()=>{
    const ap=['Accepted','Interview','Hired'].includes(el.dataset.st)?[...el.querySelectorAll('[data-o].on')].map(b=>b.dataset.o):[];
    const{error}=await sb.from('candidates').update({status:el.dataset.st,approved_offers:ap,feedback:el.querySelector('textarea').value}).eq('id',c.id);
    if(error)return toast(error.message);await load();render();toast(t('Saved'))};
  if(el.querySelector('.dl'))el.querySelector('.dl').onclick=async()=>{
    if(!confirm(t('Delete')+' '+c.full_name+'?'))return;
    if(c.voice_path)await sb.storage.from('voice-notes').remove([c.voice_path]);
    const{error}=await sb.from('candidates').delete().eq('id',c.id);if(error)return toast(error.message);await load();render()};
}

  el.querySelectorAll('[data-p]').forEach(card=>{const id=+card.dataset.p;
    card.querySelector('.lk2').onclick=async()=>{const liked=D.l.some(x=>x.post_id===id&&x.user_id===sess.user.id);const{error}=await(liked?sb.from('post_likes').delete().match({post_id:id,user_id:sess.user.id}):sb.from('post_likes').insert({post_id:id}));if(error)return toast(error.message);await load();render()};
    const go=async()=>{const v=card.querySelector('.ci').value.trim();if(!v)return;const{error}=await sb.from('post_comments').insert({post_id:id,author:me.full_name,body:v});if(error)return toast(error.message);await load();render()};
    const cb=card.querySelector('.cb'),ci=card.querySelector('.ci');if(cb&&ci){cb.onclick=go;ci.onkeydown=e=>{if(e.key==='Enter')go()} }});
  el.querySelectorAll('[data-cl]').forEach(b=>b.onclick=async()=>{const id=+b.dataset.cl,liked=D.cl.some(x=>x.comment_id===id&&x.user_id===sess.user.id);const{error}=await(liked?sb.from('comment_likes').delete().match({comment_id:id,user_id:sess.user.id}):sb.from('comment_likes').insert({comment_id:id}));if(error)return toast(error.message);await load();render()});
  const closePost=id=>{expandedPosts.delete(id);D.m.filter(x=>x.post_id===id).forEach(x=>expandedThreads.delete(x.id))};
  el.querySelectorAll('[data-post-comments]').forEach(b=>b.onclick=()=>{const id=+b.dataset.postComments;if(expandedPosts.has(id))closePost(id);else{expandedPosts.clear();expandedThreads.clear();expandedPosts.add(id)}render()});
  el.querySelectorAll('[data-close-comments]').forEach(b=>b.onclick=()=>{closePost(+b.dataset.closeComments);render()});
  el.querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>{const id=+b.dataset.thread;expandedThreads.has(id)?expandedThreads.delete(id):expandedThreads.add(id);render()});
  el.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>{const box=el.querySelector(`[data-rb="${b.dataset.reply}"]`);box.hidden=!box.hidden;if(!box.hidden)box.querySelector('.ri').focus()});
  el.querySelectorAll('[data-rb]').forEach(box=>{const send=async()=>{const v=box.querySelector('.ri').value.trim();if(!v)return;const{error}=await sb.from('post_comments').insert({post_id:+box.closest('[data-p]').dataset.p,parent_id:+box.dataset.rb,author:me.full_name,body:v});if(error)return toast(error.message);await load();render()};box.querySelector('.rb').onclick=send;box.querySelector('.ri').onkeydown=e=>{if(e.key==='Enter')send()}});
  el.querySelectorAll('[data-dc]').forEach(a=>a.onclick=async e=>{e.preventDefault();await sb.from('post_comments').delete().eq('id',a.dataset.dc);await load();render()});
}
/* ---------- Alerts (live) ---------- */
const EM={New:'⏳',Contacted:'📞',Interview:'🎤',Accepted:'✅',Hired:'🏆',Rejected:'❌','No answer':'📵'};
function live(){if(ch)return;ch=sb.channel('nt').on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications'},async p=>{const n=p.new;await load();if(!document.activeElement.matches('textarea,input'))render();if(tab!=='a')toast(`${EM[n.status]||'🔔'} ${n.candidate_name}: ${t(n.status)}`)}).subscribe()}
function paneA(){
  if(D.a[0])localStorage.seen=D.a[0].id;
  $('#pane').innerHTML=`<input id="as" placeholder="🔍 ${t('Search...')}" value="${esc(aq)}" style="margin-bottom:12px"><div id="al"></div>`;
  const draw=()=>{const k=aq.trim().toLowerCase();
    const r=D.a.filter(n=>!k||[n.candidate_name,n.offer,(n.offers||[]).join(' '),n.feedback,n.status].some(v=>(v||'').toLowerCase().includes(k)));
    $('#al').innerHTML=r.length?r.map(n=>{const d=new Date(n.created_at);
      const w=d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' at '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      const o=(n.offers&&n.offers.length)?n.offers.join(' · '):(n.offer||'');
      return `<div class="card nt ${esc(n.status)}"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><b>${EM[n.status]||'🔔'} ${t('Voice note of')} ${esc(n.candidate_name)}: ${t(n.status)}</b><span class="meta" style="white-space:nowrap">${w}</span></div><div class="meta">${esc(o)}</div>${n.feedback?`<div>${esc(n.feedback)}</div>`:''}<div class="meta">${t('by')} ${esc(n.actor_name||'')}</div>${acts(n)}</div>`}).join(''):'<div class="empty">—</div>';
    $('#al').querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();openCandidateFlow(b.dataset.go)});
  };
  $('#as').oninput=e=>{aq=e.target.value;draw()};
  draw();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-go]');
  if(b){e.preventDefault();openCandidateFlow(b.dataset.go)}
});

/* ---------- Team ---------- */
function paneT(){
  $('#pane').innerHTML=D.t.map(m=>`<div class="card"><div class="row"><b>${esc(m.full_name)}</b><span class="badge">${t(m.role==='owner'?'Owner':'Recruiter')}</span></div>${owner()?`<div class="meta">${t('Candidates')}: ${D.c.filter(c=>c.recruiter_id===m.id).length}</div>`:''}${owner()&&m.id!==me.id?`<button class="d" data-r="${m.id}">${t('Remove')}</button>`:''}</div>`).join('');
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{if(!confirm('?'))return;const{error}=await sb.from('profiles').delete().eq('id',b.dataset.r);if(error)toast(error.message);await load();render()});
}

/* ---------- News ---------- */
function paneN(){
  $('#pane').innerHTML=(owner()?`<div class="card"><textarea id="nb" rows="3"></textarea><div style="margin-top:10px"><button class="p" id="np">${t('Post')}</button></div></div>`:'')+(D.n.map(n=>`<div class="card"><div style="white-space:pre-wrap">${esc(n.body)}</div><div class="meta">${esc(n.author||'')} · ${new Date(n.created_at).toLocaleString()}</div>${owner()?`<button class="d" data-n="${n.id}">${t('Delete')}</button>`:''}</div>`).join('')||'<div class="empty">—</div>');
  if(owner()){$('#np').onclick=async()=>{const b=$('#nb').value.trim();if(!b)return;await sb.from('news').insert({body:b,author:me.full_name});await load();render()};
    document.querySelectorAll('[data-n]').forEach(b=>b.onclick=async()=>{await sb.from('news').delete().eq('id',b.dataset.n);await load();render()})}
}

/* ---------- Invites + Offers (owner) ---------- */
function paneI(){
  $('#pane').innerHTML=`<div class="card"><button class="p" id="gi">${t('Generate invite')}</button></div>`+
  D.i.map(i=>`<div class="card"><div class="row"><b style="letter-spacing:2px;font-size:20px">${esc(i.code)}</b><span class="badge">${t(i.used_by?'Used':'Unused')}</span></div>${i.used_by?'':`<button data-c="${esc(i.code)}" style="margin-top:8px">${t('Copy')}</button>`}</div>`).join('')+
  `<div class="card"><h2>${t('Offers')}</h2><div class="row" style="flex-wrap:nowrap"><input id="on"><button class="p" id="oa">${t('Add')}</button></div><div style="margin-top:12px">${D.o.map(o=>`<div class="row" style="margin:6px 0"><span style="opacity:${o.active?1:.45}">${esc(o.name)} ${o.form_link?'🔗':''}${o.template_url?'🖼':''}</span><span><button data-ol="${o.id}">🔗</button> <button data-oi="${o.id}">🖼</button> <button data-ot="${o.id}">${o.active?'On':'Off'}</button> <button class="d" data-od="${o.id}">×</button></span></div>`).join('')}</div></div>`;
  $('#gi').onclick=async()=>{const code=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('');const{error}=await sb.from('invites').insert({code,created_by:me.id});if(error)return toast(error.message);await load();render()};
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.c);toast(t('Copied'))});
  document.querySelectorAll('[data-ol]').forEach(b=>b.onclick=async()=>{const o=D.o.find(x=>x.id==b.dataset.ol);const v=prompt('Application form link for '+o.name+' (https://...)',o.form_link||'');if(v===null)return;if(v&&!/^https?:\/\//i.test(v))return toast('Link must start with https://');await sb.from('offers').update({form_link:v||null}).eq('id',o.id);await load();render()});
  document.querySelectorAll('[data-oi]').forEach(b=>b.onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{const f=i.files[0];if(!f)return;const path='template/'+Date.now()+'-'+f.name.replace(/[^\w.\-]/g,'_');const u=await sb.storage.from('voice-notes').upload(path,f);if(u.error)return toast(u.error.message);await sb.from('offers').update({template_url:sb.storage.from('voice-notes').getPublicUrl(path).data.publicUrl}).eq('id',b.dataset.oi);await load();render();toast(t('Saved'))};i.click()});
  $('#oa').onclick=async()=>{const n=$('#on').value.trim();if(!n)return;await sb.from('offers').insert({name:n});await load();render()};
  document.querySelectorAll('[data-ot]').forEach(b=>b.onclick=async()=>{const o=D.o.find(x=>x.id==b.dataset.ot);await sb.from('offers').update({active:!o.active}).eq('id',o.id);await load();render()});
  document.querySelectorAll('[data-od]').forEach(b=>b.onclick=async()=>{await sb.from('offers').delete().eq('id',b.dataset.od);await load();render()});
}
boot();
</script></body></html>
